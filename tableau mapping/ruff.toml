line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
]

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatting)
    "E701", # multiple statements on one line (existing codebase pattern)
    "E741", # ambiguous variable name (used in color math functions)
    "E402", # module-level import not at top (circular dependency avoidance)
    "B008", # do not perform function calls in argument defaults (used heavily in FastAPI Depends)
    "B904", # raise-from in except clauses (existing HTTP exception pattern)
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
