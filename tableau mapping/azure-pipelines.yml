trigger:
  branches:
    include:
      - dev
      - test
      - main

variables:
  vmImage: 'ubuntu-latest'
  imageName: 't2f-mapping'
  dockerfilePath: 'Dockerfile'
  buildContext: '.'
  tagBuildId: '$(Build.BuildId)'

stages:
# ==========================
# STAGE: QUALITY GATES
# ==========================
- stage: QualityGates
  displayName: 'Quality Gates'
  jobs:
  - job: LintAndTest
    displayName: 'LintAndTest'
    pool: { vmImage: $(vmImage) }
    steps:
    - checkout: self

    - task: UsePythonVersion@0
      displayName: 'Use Python 3.11'
      inputs:
        versionSpec: '3.11'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install Dependencies'

    - script: |
        ruff check . --output-format=github
      displayName: 'Run Ruff Linter'

    - script: |
        pytest
      displayName: 'Run Pytest'

# ==========================
# STAGE: DEV
# ==========================
- stage: Dev
  displayName: 'Build & Push Dev'
  dependsOn: QualityGates
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
  jobs:
  - deployment: BuildDev
    environment: 'Development'
    pool: { vmImage: $(vmImage) }
    variables:
      imageRepository: '$(imageName)-dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: Docker@2
            displayName: 'Build and Push'
            inputs:
              containerRegistry: $(acrDev)
              repository: $(imageRepository)
              command: buildAndPush
              Dockerfile: $(dockerfilePath)
              tags: |
                latest
                $(tagBuildId)

# ==========================
# STAGE: TEST (Requires Approval)
# ==========================
- stage: Test
  displayName: 'Build & Push Test'
  dependsOn: QualityGates
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/test'))
  jobs:
  - deployment: BuildTest
    environment: 'Testing' # Linked to your UI Approvals
    pool: { vmImage: $(vmImage) }
    variables:
      imageRepository: '$(imageName)-test'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: Docker@2
            displayName: 'Build and Push'
            inputs:
              containerRegistry: $(acrTest)
              repository: $(imageRepository)
              command: buildAndPush
              Dockerfile: $(dockerfilePath)
              tags: |
                latest
                $(tagBuildId)

# ==========================
# STAGE: PROD (Requires Approval)
# ==========================
- stage: Prod
  displayName: 'Build & Push Prod'
  dependsOn: QualityGates
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: BuildProd
    environment: 'Production' # Linked to your UI Approvals
    pool: { vmImage: $(vmImage) }
    variables:
      imageRepository: '$(imageName)-prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: Docker@2
            displayName: 'Build and Push'
            inputs:
              containerRegistry: $(acrProd)
              repository: $(imageRepository)
              command: buildAndPush
              Dockerfile: $(dockerfilePath)
              tags: |
                latest
                $(tagBuildId)